operatingLoops:
  - name: "Daily Command Loop"
    cadence: "daily"
    owner: "chief-operator"
    purpose: "Select the highest-leverage work, route it to one bounded execution lane, and end with evidence."
    inputs:
      - "global-progress-ledger.json"
      - "hermes-cockpit progress reports"
      - "repo status"
    outputs:
      - "one active priority"
      - "bounded task queue"
      - "handoff note"
    safetyGate: "No production, billing, DNS, secret, or destructive mutation without explicit named approval."
  - name: "Business Ops Loop"
    cadence: "daily plus weekly review"
    owner: "business-command"
    purpose: "Turn offers, client delivery, invoices, proof, and launch blockers into a visible operating cadence."
    inputs:
      - "business module"
      - "FrankX docs"
      - "public site/download surfaces"
    outputs:
      - "offer backlog"
      - "delivery tasks"
      - "proof and revenue blockers"
    safetyGate: "Payment setup, public claims, and client commitments require human review."
  - name: "Learning And Mastery Loop"
    cadence: "weekly"
    owner: "learning-systems"
    purpose: "Convert research, courses, repos, and experiments into skill upgrades and reusable playbooks."
    inputs:
      - "ai-architect-academy"
      - "prompt-library"
      - "Starlight memory"
    outputs:
      - "learning sprint"
      - "skill update"
      - "evidence-backed notes"
    safetyGate: "Separate source-backed learning from unsupported claims."
  - name: "Practice And Palace Loop"
    cadence: "daily private session plus weekly review"
    owner: "lifeos-practice"
    purpose: "Turn an intention into a bounded practice, observation, reflection, evidence-linked memory anchor, and user-confirmed next commitment."
    inputs:
      - "private practice packs"
      - "user-authored reflections"
      - "scoped memory references"
    outputs:
      - "action receipt"
      - "memory anchor"
      - "proposed next commitment"
    safetyGate: "No raw private data leaves the local vault; spiritual packs preserve source context; health work remains under Health Intelligence System boundaries."
  - name: "Growth And Distribution Loop"
    cadence: "weekly"
    owner: "growth-ops"
    purpose: "Move audience attention into useful downloads, demos, trust proof, and follow-up workflows."
    inputs:
      - "frankx.ai-vercel-website"
      - "analytics reports"
      - "release artifacts"
    outputs:
      - "campaign brief"
      - "download/update checklist"
      - "conversion evidence"
    safetyGate: "Public pages need claim, privacy, attribution, and checkout readiness checks."
  - name: "Creator Production Loop"
    cadence: "weekly"
    owner: "creator-ops"
    purpose: "Turn ideas, music, video, articles, and visual systems into publishable creative assets."
    inputs:
      - "agentic-creator-os"
      - "visual-intelligence"
      - "Arcanea media repos"
    outputs:
      - "asset backlog"
      - "publication packet"
      - "quality score"
    safetyGate: "Rights, attribution, taste, and platform policy checks run before publishing."
  - name: "Health And Excellence Loop"
    cadence: "daily private log plus weekly review"
    owner: "health-intelligence-ops"
    purpose: "Support energy, training, nutrition, sleep, recovery, and clinician preparation without replacing professionals."
    inputs:
      - "health package"
      - "health-intelligence-system"
      - "private records"
    outputs:
      - "wellness plan"
      - "clinician questions"
      - "evidence ledger"
    safetyGate: "No diagnosis, treatment, or medication decisions; clinician authority stays explicit."
  - name: "Wealth And Capital Loop"
    cadence: "weekly"
    owner: "investor-ops"
    purpose: "Track capital allocation, due diligence, portfolio state, and business cashflow connections."
    inputs:
      - "investor package"
      - "business receivables"
      - "deal notes"
    outputs:
      - "portfolio snapshot"
      - "due-diligence queue"
      - "decision memo"
    safetyGate: "No financial advice or autonomous capital movement."
  - name: "Swarm And Evals Loop"
    cadence: "per coherent work wave"
    owner: "starlight-substrate-ops"
    purpose: "Route bounded worker lanes, collect handoffs, validate evidence, and preserve context for the next run."
    inputs:
      - "starlight-swarm"
      - "starlight-agent-config"
      - "ai-capability-registry"
    outputs:
      - "worker queue"
      - "eval report"
      - "progress ledger update"
    safetyGate: "One coordinator owns synthesis; every worker has allowed tools, stop condition, and handoff format."
