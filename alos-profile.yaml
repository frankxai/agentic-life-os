offering:
  name: "Agentic Life OS"
  audience: "Founder-operators, creators, and high-agency teams who want one AI-native command spine for work, learning, growth, success, and personal excellence."
  promise: "Turn the repo estate into a private operating system that routes decisions, memories, proof, agent swarms, and recurring loops into visible outcomes."
  status: "private-operator-suite"
  deliveryMode: "Git-backed system package, implementation sprint, agent runbooks, and proof-gated operating cadence."
  publicBoundary: "Public wrappers may describe the model and starter workflows. Private memory, health, finance, family, unreleased IP, strategy, credentials, and client data stay out of public assets."
  packages:
    - name: "Public Blueprint"
      audience: "Builders evaluating the Agentic Life OS model."
      promise: "Understand the architecture, module map, and first workflow without exposing private operating data."
      deliveryMode: "Sanitized docs, examples, and install notes."
      commercialStatus: "free"
      supportBoundary: "Self-serve only."
    - name: "Starter Operator Kit"
      audience: "Solo founders and creators who want a local command spine."
      promise: "Fork the core profile, run the health checks, and start the daily command loop."
      deliveryMode: "Template repo plus setup checklist."
      commercialStatus: "proposed-not-priced"
      supportBoundary: "Setup support only; no private-data handling."
    - name: "Private Life OS Implementation"
      audience: "Frank's own operating layer and selected high-trust clients."
      promise: "Connect business, creator, memory, health, wealth, family, and learning loops with bounded agent execution."
      deliveryMode: "Guided implementation sprint with private runbooks."
      commercialStatus: "private-only"
      supportBoundary: "Explicit scope, approval gates, and privacy boundaries required."
    - name: "Enterprise Intelligence System"
      audience: "Teams needing agent governance, memory, evals, and repo-operating discipline."
      promise: "Deploy the Starlight intelligence substrate and operating doctrine without personal-life modules."
      deliveryMode: "Architecture engagement, repo harness, and validation gates."
      commercialStatus: "proposed-not-priced"
      supportBoundary: "Architecture and enablement; production mutations require named approval."

intelligenceSystems:
  - name: "Starlight Intelligence System"
    repoName: "Starlight-Intelligence-System"
    layer: "substrate"
    publicStatus: "hybrid"
    purpose: "Memory, provenance, taxonomy, validation, release artifacts, and proof for agentic systems."
    proofGate: "Run SIS health checks, keep public/private boundaries explicit, and attach evidence paths to releases."
  - name: "Starlight Agent Config"
    repoName: "starlight-agent-config"
    layer: "agent-governance"
    publicStatus: "private"
    purpose: "Cross-agent skills, policies, task ledgers, install projection, and machine-local operating rules."
    proofGate: "Run installer doctor before handoff when config projection changes."
  - name: "Agentic Ops Hub"
    repoName: "agentic-ops-hub"
    layer: "agent-governance"
    publicStatus: "hybrid"
    purpose: "Agent instruction control plane, coordination rules, ASPH handoffs, and repo fleet operating doctrine."
    proofGate: "Sync/check generated agent rules before release-quality changes."
  - name: "Starlight Swarm Runtime"
    repoName: "starlight-swarm"
    layer: "swarm-runtime"
    publicStatus: "hybrid"
    purpose: "Queen-worker topology, dry-run safety spine, escalation ladders, and bounded loop execution."
    proofGate: "Run dry-run, typecheck, and tests; no autonomous live money or production actions."
  - name: "AI Capability Registry"
    repoName: "ai-capability-registry"
    layer: "capability-index"
    publicStatus: "hybrid"
    purpose: "Index of skills, plugins, activation routes, and agent capability surfaces."
    proofGate: "Regenerate the capability index after route or plugin changes."
  - name: "Hermes Cockpit"
    repoName: "hermes-cockpit"
    layer: "orchestration"
    publicStatus: "private"
    purpose: "Operational cockpit for progress reports, Railway-aware estate state, and agent work evidence."
    proofGate: "Progress collector writes latest evidence without reading secrets."
  - name: "Health Intelligence System"
    repoName: "health-intelligence-system"
    layer: "domain-vertical"
    publicStatus: "hybrid"
    purpose: "Safety-gated personal health and clinician-prep patterns separated from research-only workflows."
    proofGate: "Health work keeps human clinical authority and evidence dates explicit."
  - name: "Design and Visual Intelligence"
    repoName: "starlight-design-intelligence"
    layer: "quality-gate"
    publicStatus: "hybrid"
    purpose: "Design taste, visual QA, motion rubrics, and premium experience validation."
    proofGate: "Visual work passes screenshots, responsive checks, and the taste rubric before handoff."

