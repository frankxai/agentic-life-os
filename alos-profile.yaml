systemName: "Agentic Life OS (ALOS)"
version: "1.4.0"
sipVersion: "1.1.1"
profileAssertionStatus: "unverified-declarative-configuration"
workstation:
  machineName: "local-instance"
  os: "Portable Node.js 24 target; Windows verified, Linux CI pending"

publicContract:
  assetSchemaVersion: "1.3.0"
  runtime:
    mode: "local-open-core"
    authority: "private-runtime-authority-store"
    defaultAdmission: "deny"
  healthKnowledgeSource:
    repository: "frankxai/health-intelligence-system"
    requiredBindings: ["pinVersion", "repository", "commitSha", "artifactVersion", "artifactPath", "mediaType", "byteLength", "sha256"]
  prohibitedPublicData:
    - "raw-health-records"
    - "clinical-data"
    - "genomic-data"
    - "family-records"
    - "secrets"
    - "authority-state"
    - "personal-metrics"
  prohibitedAgentActions:
    - "diagnosis"
    - "treatment"
    - "medication-change"
    - "result-interpretation"
    - "emergency-reassurance"
    - "autonomous-transport"
    - "public-storage-of-private-records"
  familyDataGate:
    dataClasses: ["family-records", "genomic-data"]
    deniedDestinations: ["memory", "creator"]
    requiredControls:
      - "private-encrypted-deployment"
      - "consent"
      - "audit"
      - "backup-restore"
      - "audience-authorization"
      - "succession-controls"

modules:
  business:
    repoName: "agentic-business-os"
    path: "packages/business"
    status: "in-development"
    riskLevel: "template"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private business-adapter planning; public code accepts no entities, clients, invoices, dates, or amounts."
  creator:
    repoName: "agentic-creator-os"
    path: "packages/creator"
    status: "in-development"
    riskLevel: "template"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private creator-adapter planning; public code accepts no titles, outlines, paths, metadata, or raw content."
  memory:
    repoName: "second-brain-os"
    path: "packages/memory"
    status: "in-development"
    riskLevel: "private"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private memory-adapter planning; public code accepts no labels, transcripts, metadata, paths, or raw content."
  orchestration:
    repoName: "agentic-orchestration-os"
    path: "packages/orchestration"
    status: "in-development"
    riskLevel: "library"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Bounded cross-module orchestration with explicit stop conditions."
  investor:
    repoName: "agentic-investor-os"
    path: "packages/investor"
    status: "in-development"
    riskLevel: "template"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private wealth-adapter planning; public code accepts no holdings, values, deals, or financial identifiers and provides no advice."
  health:
    repoName: "agentic-health-os"
    path: "packages/health"
    status: "in-development"
    riskLevel: "private"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Sovereign health-data boundary, wellness organization, and clinician preparation."
  lifeSciencesResearcher:
    repoName: "life-sciences-researcher-is"
    path: "packages/life-sciences-researcher"
    status: "in-development"
    riskLevel: "template"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private research-adapter planning; public code performs no lookup and returns no scientific data."
  family:
    repoName: "agentic-family-os"
    path: "packages/family"
    status: "in-development"
    riskLevel: "private"
    healthCheck: "vitest-module"
    activeAgents: ["local-agent"]
    purpose: "Descriptor-only private family-adapter planning; public code accepts no people, relationships, evidence, reviewer claims, genetics, or publication payloads."

offering:
  name: "Agentic Life OS"
  audience: "Builders who want a local-first, bounded agent runtime for life domains."
  promise: "Compose reusable agents without placing personal data or authority in public code."
  status: "draft"
  deliveryMode: "Planned clean-history public projection with synthetic examples and a private-instance overlay template."
  publicBoundary: "Publication-candidate code and synthetic data only; live records, secrets, authority, and metrics stay private."
  packages:
    - name: "Public Runtime"
      audience: "Developers and researchers"
      promise: "Use bounded contracts, tests, and templates under an open-source license."
      deliveryMode: "Self-hosted source code"
      commercialStatus: "free"
      supportBoundary: "Community and self-serve; no personal-data processing."
    - name: "Private Instance Overlay"
      audience: "Individuals and trusted local operators"
      promise: "Configure the public runtime without forking personal data into product code."
      deliveryMode: "Generic local-first template"
      commercialStatus: "free"
      supportBoundary: "The operator owns storage, consent, clinical decisions, and backups."

intelligenceSystems:
  - name: "Starlight Intelligence System"
    repoName: "Starlight-Intelligence-System"
    layer: "substrate"
    publicStatus: "hybrid"
    purpose: "Memory, provenance, taxonomy, and validation substrate."
    proofGate: "Keep public and private state separate and attach deterministic evidence."
  - name: "Health Intelligence System"
    repoName: "health-intelligence-system"
    layer: "domain-vertical"
    publicStatus: "publication-candidate"
    purpose: "Evidence, protocols, privacy patterns, and clinician-preparation templates."
    proofGate: "Pin artifacts by immutable commit, version, path, length, and SHA-256."

estateRepos:
  - name: "agentic-life-os"
    lane: "master-offer"
    role: "Private hardening source for a clean-history public runtime projection and private-instance overlay contract."
    source: "repo-evidenced"
    status: "primary"
  - name: "health-intelligence-system"
    lane: "health"
    role: "Public health evidence and protocol source."
    source: "repo-evidenced"
    status: "primary"
  - name: "Starlight-Intelligence-System"
    lane: "substrate"
    role: "Memory, provenance, and validation substrate."
    source: "repo-evidenced"
    status: "supporting"

operatingLoops:
  - name: "Daily Command Loop"
    cadence: "daily"
    owner: "human-operator"
    purpose: "Select one bounded objective, authorize it, execute it, and retain evidence."
    inputs: ["private queue", "current authority", "public runtime"]
    outputs: ["bounded task", "decision receipt", "handoff"]
    safetyGate: "No external, financial, clinical, destructive, or sensitive-data action without explicit authority."
  - name: "Health And Excellence Loop"
    cadence: "private daily log plus weekly review"
    owner: "human-operator"
    purpose: "Organize wellness signals and clinician questions without replacing professional care."
    inputs: ["encrypted local vault descriptors", "pinned public health artifacts"]
    outputs: ["report-only structured review validation", "clinician-question templates", "planned private-adapter export controls"]
    safetyGate: "No diagnosis, treatment, medication, result interpretation, or emergency reassurance."
