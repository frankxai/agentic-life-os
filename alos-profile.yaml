systemName: "Agentic Life OS (ALOS)"
version: "1.0.0"
sipVersion: "1.1.1"
workstation:
  machineName: "Local Development Workstation"
  os: "Windows"

modules:
  business:
    repoName: "agentic-business-os"
    path: "packages/business"
    status: "in-development"
    riskLevel: "production"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
      - "Codex"
    purpose: "Business operations, legal corporate compliance, Dutch BV ops (Arcanea Labs BV), and claim safeguards."

  creator:
    repoName: "agentic-creator-os"
    path: "packages/creator"
    status: "in-development"
    riskLevel: "production"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
      - "Cursor"
      - "Antigravity"
    purpose: "Multi-agent content engine, workshops OS, visual assets design, and Suno AI music production pipelines."

  memory:
    repoName: "second-brain-os"
    path: "packages/memory"
    status: "in-development"
    riskLevel: "private"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
      - "Codex"
    purpose: "Persistent knowledge storage, double-vault air-gapped Obsidian summaries, and chat history distillations."

  orchestration:
    repoName: "agentic-orchestration-os"
    path: "packages/orchestration"
    status: "in-development"
    riskLevel: "production"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
      - "Antigravity"
    purpose: "Ecosystem orchestration, package dependency checks, custom ZSH/PowerShell toolkits, and command grids."

  investor:
    repoName: "agentic-investor-os"
    path: "packages/investor"
    status: "in-development"
    riskLevel: "private"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
    purpose: "Sovereign wealth calculation, capital allocation, deal scouting, due diligence, and investment tracking."

  health:
    repoName: "agentic-health-os"
    path: "packages/health"
    status: "in-development"
    riskLevel: "private"
    healthCommand: "vitest run"
    activeAgents:
      - "Claude Code"
      - "Gemini"
    purpose: "Biomedical research query gateways integrating OpenFDA, dbSNP, ChEMBL, ClinicalTrials, and AlphaFold structure lookups."

  family:
    repoName: "agentic-family-os"
    path: "packages/family"
